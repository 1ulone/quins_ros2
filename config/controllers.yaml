controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

joint_trajectory_controller:
  ros__parameters:
    joints:
      - bl_shoulder_joint
      - bl_thigh_joint
      - bl_leg_joint
      - br_shoulder_joint
      - br_thigh_joint
      - br_leg_joint
      - tl_shoulder_joint
      - tl_thigh_joint
      - tl_leg_joint
      - tr_shoulder_joint
      - tr_thigh_joint
      - tr_leg_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: true
    open_loop_control: false
    gains:
      bl_shoulder_joint: {p: 100.0, i: 1.0, d: 10.0}
      bl_thigh_joint:    {p: 100.0, i: 1.0, d: 10.0}
      bl_leg_joint:      {p: 100.0, i: 1.0, d: 10.0}
      br_shoulder_joint: {p: 100.0, i: 1.0, d: 10.0}
      br_thigh_joint:    {p: 100.0, i: 1.0, d: 10.0}
      br_leg_joint:      {p: 100.0, i: 1.0, d: 10.0}
      tl_shoulder_joint: {p: 100.0, i: 1.0, d: 10.0}
      tl_thigh_joint:    {p: 100.0, i: 1.0, d: 10.0}
      tl_leg_joint:      {p: 100.0, i: 1.0, d: 10.0}
      tr_shoulder_joint: {p: 100.0, i: 1.0, d: 10.0}
      tr_thigh_joint:    {p: 100.0, i: 1.0, d: 10.0}
      tr_leg_joint:      {p: 100.0, i: 1.0, d: 10.0}
